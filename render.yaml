services:
  - type: web
    name: mental-model
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MENTAL_MODEL_LLM
        value: gpt-5.6-sol
      - key: MENTAL_MODEL_REASONING_EFFORT
        value: medium
      - key: ALLOW_LOCAL_REPOS
        value: "false"
      - key: MAX_TOTAL_REPOSITORIES
        value: "6"
      - key: GIT_CLONE_TIMEOUT_SECONDS
        value: "120"
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "28800"
      - key: AUTH_FAILURE_LIMIT
        value: "5"
      - key: ASK_RATE_LIMIT
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
